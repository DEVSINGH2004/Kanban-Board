<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="nav">
            <div class="left">
                <p>Kanban Board</p>
            </div>
            <div id="toggle-modal" class="right">
                <button>Add New Task</button>
            </div>
        </div>
        <div class="board-container">
            <div id="todo" class="board">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>
                
                
            </div>
            <div id="progress" class="board">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>
                </div>
            </div>
            <div id="done" class="board">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal">
        <div class="bg"></div>
        <div class="center">
            <input id="title" type="text" placeholder="Task Title">
            <textarea id="description" placeholder="Task Description"></textarea>
            <button id="add-task">Add Task</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
